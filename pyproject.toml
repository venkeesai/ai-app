[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-molecular-analysis"
version = "0.1.1"
description = "Single-file Python AI molecular analysis dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "streamlit>=1.43,<2",
  "plotly>=6,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
chem = [
  "rdkit>=2024.9.1",
  "ase>=3.24",
  "torchani>=2.2",
]

dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
