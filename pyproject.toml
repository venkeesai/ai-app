[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi4-platform"
version = "0.1.0"
description = "Single-file Python tool for generating transparent Psi4 workflows from natural-language chemistry requests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI Codex"}]
dependencies = []

[project.scripts]
psi4-platform = "psi4_platform:main"

[tool.setuptools]
py-modules = ["psi4_platform"]
